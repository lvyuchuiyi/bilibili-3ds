<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>BiliBili 3DS QR</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f5f5f5}
h2{color:#00a1d6}
canvas{border:8px solid #fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.info{color:#666;font-size:14px;margin:20px}
.steps{text-align:left;max-width:400px;margin:20px auto;background:#fff;padding:16px;border-radius:8px}
</style>
</head>
<body>
<h2>BiliBili 3DS</h2>
<p>FBI 扫码安装二维码</p>
<canvas id="qc" width="256" height="256"></canvas>
<div class="steps">
<b>安装步骤：</b><br>
1. 3DS 打开 FBI<br>
2. Remote Install → Scan QR Code<br>
3. 扫码后下载安装 .cia<br>
<br>
<b>注意：</b>需要先在 GitHub Releases 上传 .cia 文件<br>
<a href="https://github.com/lvyuchuiyi/bilibili-3ds/releases">github.com/lvyuchuiyi/bilibili-3ds/releases</a>
</div>
<script>
// QR码生成器 (最小实现)
(function(){
var url = "https://github.com/lvyuchuiyi/bilibili-3ds/releases/latest/download/bilibili3ds.cia";
var c = document.getElementById("qc");
var ctx = c.getContext("2d");
var size = 21; // QR version 1
var module = 256 / (size + 8);
var off = module * 4;

// 简化版 QR 码 - 只生成可用于 FBI 识别的有效二维码
// 使用嵌入的 qrcodejs 库
var s = document.createElement("script");
s.src = "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";
s.onload = function(){new QRCode(c,{text:url,width:256,height:256})};
s.onerror = function(){
  document.querySelector("canvas").style.display="none";
  document.body.innerHTML += '<p style="color:red">无法加载 QR 码库</p>';
  document.body.innerHTML += '<p>请复制链接到手机浏览器打开：<br><b>'+url+'</b></p>';
};
document.head.appendChild(s);
})();
</script>
</body>
</html>
