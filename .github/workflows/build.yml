name: Build BiliBili 3DS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install makerom if missing
      run: |
        command -v makerom || dkp-pacman -S --noconfirm general-tools || true
    
    - name: Build .3dsx and .cia
      run: |
        make release -j$(nproc)
        echo "=== Output files ==="
        find . -name "*.3dsx" -o -name "*.cia" -o -name "*.smdh" 2>/dev/null
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.cia
          *.smdh
          build/*.3dsx
          build/*.cia
          build/*.smdh
        if-no-files-found: warn
