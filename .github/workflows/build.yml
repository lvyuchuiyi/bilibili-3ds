name: Build BiliBili 3DS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
    - uses: actions/checkout@v4
    - name: Install makerom
      run: |
        curl -sLo /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
        unzip -o /tmp/makerom.zip -d /tmp/makerom
        cp /tmp/makerom/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
    - name: Build .3dsx and .cia
      run: |
        make -j$(nproc) cia 2>&1
        echo "=== Files ==="
        find . -name "*.3dsx" -o -name "*.cia" -o -name "*.elf" -o -name "*.smdh" 2>/dev/null
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.cia
          *.smdh
        if-no-files-found: warn
    - name: Install gh CLI
      run: |
        apt-get update -qq
        apt-get install -y -qq gh 2>/dev/null || true
    - name: Create Release
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/fix/full-app'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        CIA=$(find . -name "*.cia" | head -1)
        ELF=$(find . -name "*.3dsx" | head -1)
        echo "Found CIA: $CIA"
        echo "Found 3DSX: $ELF"
        TAG="v$(date +%Y%m%d-%H%M%S)"
        gh release create "$TAG" \
          --title "BiliBili 3DS $TAG" \
          --notes "Auto-build from commit ${{ github.sha }}" \
          "$CIA" "$ELF"