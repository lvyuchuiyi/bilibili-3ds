name: Build BiliBili 3DS
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install makerom
      run: |
        echo "=== Installing makerom via dkp-pacman ==="
        dkp-pacman -S --noconfirm general-tools 2>&1 || true
        echo "=== Searching for makerom ==="
        find /opt/devkitpro -name "makerom" 2>/dev/null
        if [ -f /opt/devkitpro/tools/bin/makerom ]; then
          echo "Using dkp-pacman makerom"
          export PATH=/opt/devkitpro/tools/bin:$PATH
        elif command -v makerom >/dev/null 2>&1; then
          echo "makerom found in PATH"
        else
          echo "Downloading makerom binary..."
          curl -sL -o /tmp/m.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -o /tmp/m.zip -d /tmp/m
          cp /tmp/m/makerom /usr/local/bin/
          chmod +x /usr/local/bin/makerom
        fi
        which makerom
        makerom -help 2>&1 | head -3
    - name: Build
      run: |
        make -j$(nproc)
        ELF=$(find . -name "*.elf" | head -1)
        SMDH=$(find . -name "*.smdh" | head -1)
        makerom -f cxi -o bilibili3ds.cxi -target t -elf "$ELF" -icon "$SMDH" -banner "$SMDH" -desc app:4 -rsf resources/bilibili3ds.rsf 2>&1 && makerom -f cia -o bilibili3ds.cia -target t -i bilibili3ds.cxi:0:0 2>&1 || echo "CIA_FAILED"
        ls -la *.3dsx *.cia *.smdh 2>/dev/null

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.cia
          *.smdh
        if-no-files-found: warn