name: Build BiliBili 3DS
on:
  push:
  workflow_dispatch:
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
    - uses: actions/checkout@v4
    - name: Install makerom
      run: |
        curl -sLo /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
        unzip -o /tmp/makerom.zip -d /tmp/makerom
        cp /tmp/makerom/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
    - name: Build
      run: make -j$(nproc) 2>&1
    - name: Generate SMDH icon
      run: smdhtool --create "BiliBili 3DS" "BiliBili client for 3DS" "Codex" bilibili3ds.smdh
    - name: Build CIA
      run: |
        makerom -f cia -o bilibili3ds.cia -elf bilibili3ds.elf -icon bilibili3ds.smdh -banner bilibili3ds.smdh -desc app:4 -rsf resources/bilibili3ds.rsf 2>&1
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: "*.3dsx\n*.cia\n*.smdh"
        if-no-files-found: warn