name: Build BiliBili 3DS
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
    - uses: actions/checkout@v4
    - name: Install makerom
      run: |
        curl -sL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
        unzip -o /tmp/makerom.zip -d /tmp/m
        cp /tmp/m/makerom /usr/local/bin/
        chmod +x /usr/local/bin/makerom
    - name: Build CIA
      run: |
        make release -j$(nproc) 2>&1
        ls -la *.3dsx *.cia *.smdh 2>/dev/null || ls -la build/*.3dsx build/*.cia build/*.smdh 2>/dev/null || true
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.cia
          *.smdh
          build/*.3dsx
          build/*.cia
          build/*.smdh
        if-no-files-found: warn