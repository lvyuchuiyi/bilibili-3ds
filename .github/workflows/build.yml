name: Dump citro2d font API
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: { image: devkitpro/devkitarm:latest }
    steps:
    - name: Dump font header
      run: |
        echo "=== font.h ==="
        cat /opt/devkitpro/libctru/include/c2d/font.h
        echo "=== looking for C2D_Text ==="
        grep -n "C2D_Text\|C2D_DrawText\|C2D_TextOpt" /opt/devkitpro/libctru/include/c2d/*.h 2>/dev/null