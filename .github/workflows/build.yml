name: Build BiliBili 3DS

on:
  push:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build .3dsx
      run: make -j$(nproc) 2>&1
    
    - name: Show artifacts
      run: ls -la *.3dsx *.elf *.smdh || true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.smdh