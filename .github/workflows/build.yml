name: Build BiliBili 3DS
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: |
        dkp-pacman -S --noconfirm general-tools 2>&1 || true
        if ! command -v makerom >/dev/null 2>&1; then
          which makerom 2>/dev/null || find / -name makerom 2>/dev/null
        fi

    - name: Build CIA
      run: |
        make release -j$(nproc)
        ls -la *.3dsx *.cia *.smdh 2>/dev/null || ls -la build/*.3dsx build/*.cia build/*.smdh 2>/dev/null || true

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.cia
          *.smdh
          build/*.3dsx
          build/*.cia
          build/*.smdh
        if-no-files-found: warn