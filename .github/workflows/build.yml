name: Build BiliBili 3DS

on:
  push:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install makerom
      run: |
        echo "Downloading makerom..."
        curl -sL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
        unzip -o /tmp/makerom.zip -d /tmp/makerom
        cp /tmp/makerom/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
    
    - name: Build .3dsx
      run: |
        make -j$(nproc) 2>&1
        echo "=== build exit code: $? ==="
        ls -la *.3dsx *.elf *.smdh 2>&1 || echo "Missing artifacts"
    
    - name: Generate CIA
      if: success()
      run: |
        makerom -f cia -o bilibili3ds.cia -elf bilibili3ds.elf -icon bilibili3ds.smdh -banner bilibili3ds.smdh -rsf resources/bilibili3ds.rsf 2>&1
        ls -la bilibili3ds.cia 2>/dev/null
    
    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.cia
          *.smdh
        if-no-files-found: warn