name: Build BiliBili 3DS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install makerom
      run: |
        echo "Downloading makerom..."
        curl -sL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
        unzip -o /tmp/makerom.zip -d /tmp/makerom
        cp /tmp/makerom/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
        makerom -help 2>&1 | head -2 || true
    
    - name: Build .3dsx and .cia
      run: |
        make -j$(nproc)
        echo "=== Build complete, creating CIA ==="
        ELF=$(find . -name "*.elf" | head -1)
        SMDH=$(find . -name "*.smdh" | head -1)
        echo "ELF: $ELF, SMDH: $SMDH"
        if [ -n "$ELF" ]; then
          makerom -f cia -o bilibili3ds.cia -elf "$ELF" -icon "$SMDH" -banner "$SMDH"
          ls -la bilibili3ds.cia
        else
          echo "No .elf found, listing all files:"
          find . -type f -name "*.3dsx" -o -name "*.elf" -o -name "*.smdh"
          exit 1
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          bilibili3ds.3dsx
          bilibili3ds.cia
          bilibili3ds.smdh
        if-no-files-found: error




