name: Build BiliBili 3DS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
    - uses: actions/checkout@v4
    - name: Install makerom
      run: |
        curl -sLo /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
        unzip -o /tmp/makerom.zip -d /tmp/makerom
        cp /tmp/makerom/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
    - name: Build .3dsx
      run: make -j$(nproc) 2>&1
    - name: Build .cia
      run: |
        makerom -f cia -o bilibili3ds.cia -elf bilibili3ds.elf -desc app:4 -rsf resources/bilibili3ds.rsf 2>&1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.cia
        if-no-files-found: warn
    - name: Install gh CLI
      run: apt-get update -qq && apt-get install -y -qq gh 2>/dev/null || true
    - name: Create Release
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/fix/full-app'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "v$(date +%Y%m%d-%H%M)" \
          --title "BiliBili 3DS $(date +%Y-%m-%d)" \
          bilibili3ds.cia bilibili3ds.3dsx