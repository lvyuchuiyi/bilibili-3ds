name: Build BiliBili 3DS

on:
  push:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install makerom
      run: |
        echo "Downloading makerom..."
        curl -sL -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
        unzip -o /tmp/makerom.zip -d /tmp/makerom
        cp /tmp/makerom/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
        echo "=== makerom help ==="
        makerom -exthelp 2>&1 | head -100 || true
    
    - name: Build .3dsx
      run: |
        make -j$(nproc)
        echo "build done"
        ls -la *.3dsx *.elf *.smdh
    
    - name: Generate CIA with makerom
      run: |
        ELF=$(find . -name "*.elf" | head -1)
        SMDH=$(find . -name "*.smdh" | head -1)
        RSF=resources/bilibili3ds.rsf
        echo "ELF=$ELF SMDH=$SMDH RSF=$RSF"
        makerom -f cia -o bilibili3ds.cia -target t -elf "$ELF" -icon "$SMDH" -banner "$SMDH" -rsf resources/bilibili3ds.rsf 2>&1 || echo "CIA failed"
        ls -la bilibili3ds.cia 2>/dev/null || echo "No CIA generated"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bilibili3ds-build
        path: |
          *.3dsx
          *.cia
          *.smdh
        if-no-files-found: warn


